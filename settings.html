<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3f82cd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>QR Frame Color</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #f0f0f0;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 430px;
        margin: 0 auto;
      }
      .header {
        width: 100%;
        background: #3f82cd;
        padding: max(54px, calc(env(safe-area-inset-top) + 10px)) 16px 20px;
        display: grid;
        grid-template-columns: 30px 1fr 30px;
        align-items: center;
        border-bottom-left-radius: 12px;
        border-bottom-right-radius: 12px;
      }
      .header a {
        color: #d6e6ff;
        font-size: 30px;
        text-decoration: none;
        line-height: 1;
      }
      .header h1 {
        margin: 0;
        color: #f1f7ff;
        text-align: center;
        font-size: 20px;
        font-weight: 620;
      }
      .content {
        padding: 32px 24px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      .preview-frame {
        width: 120px;
        height: 120px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        transition: background-color 0.2s;
      }
      .preview-inner {
        width: 100%;
        height: 100%;
        background: #fff;
        border-radius: 2px;
      }
      label {
        font-size: 16px;
        font-weight: 600;
        color: #12171d;
      }
      .color-input-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      input[type="color"] {
        -webkit-appearance: none;
        appearance: none;
        width: 60px;
        height: 44px;
        border: 2px solid #d0d3d8;
        border-radius: 10px;
        padding: 3px;
        cursor: pointer;
        background: #fff;
      }
      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 6px;
      }
      .hex-input {
        font-size: 18px;
        font-weight: 500;
        padding: 10px 14px;
        border: 2px solid #d0d3d8;
        border-radius: 10px;
        width: 130px;
        text-align: center;
        font-family: monospace;
      }
      .save-btn {
        width: 100%;
        max-width: 280px;
        padding: 14px;
        background: #3f82cd;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
      }
      .save-btn:active {
        opacity: 0.85;
      }
      .reset-btn {
        background: none;
        border: none;
        color: #5a5f66;
        font-size: 14px;
        text-decoration: underline;
        cursor: pointer;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <a href="index.html" aria-label="Back">‹</a>
      <h1>QR Frame Color</h1>
      <span></span>
    </div>
    <div class="content">
      <div class="preview-frame" id="preview">
        <div class="preview-inner"></div>
      </div>
      <label>Choose a color</label>
      <div class="color-input-row">
        <input type="color" id="colorPicker" value="#e8605c" />
        <input type="text" class="hex-input" id="hexInput" value="#e8605c" maxlength="7" />
      </div>
      <button class="save-btn" id="saveBtn">Save Color</button>
      <button class="reset-btn" id="resetBtn">Reset to Default</button>
    </div>
    <script>
      const DEFAULT_COLOR = "#e8605c";
      const preview = document.getElementById("preview");
      const colorPicker = document.getElementById("colorPicker");
      const hexInput = document.getElementById("hexInput");
      const saveBtn = document.getElementById("saveBtn");
      const resetBtn = document.getElementById("resetBtn");

      const saved = localStorage.getItem("qrFrameColor") || DEFAULT_COLOR;
      setColor(saved);

      function setColor(color) {
        preview.style.backgroundColor = color;
        colorPicker.value = color;
        hexInput.value = color;
      }

      colorPicker.addEventListener("input", () => {
        setColor(colorPicker.value);
      });

      hexInput.addEventListener("input", () => {
        const val = hexInput.value;
        if (/^#[0-9a-fA-F]{6}$/.test(val)) {
          preview.style.backgroundColor = val;
          colorPicker.value = val;
        }
      });

      saveBtn.addEventListener("click", () => {
        localStorage.setItem("qrFrameColor", colorPicker.value);
        window.location.href = "index.html";
      });

      resetBtn.addEventListener("click", () => {
        localStorage.removeItem("qrFrameColor");
        setColor(DEFAULT_COLOR);
      });
    </script>
  </body>
</html>
